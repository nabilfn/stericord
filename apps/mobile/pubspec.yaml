name: stericord_mobile
description: SteriCord CSSD and OT point-of-use companion app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  # go_router and flutter_dotenv are several majors behind latest (17.x and
  # 6.x respectively). Left pinned rather than bumped blind: this project
  # has no Flutter SDK installed to compile-verify a major-version migration
  # against. Revisit once `flutter pub get`/`flutter analyze` can actually
  # be run.
  go_router: ^14.2.7
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  image_picker: ^1.1.2
  crypto: ^3.0.5
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
